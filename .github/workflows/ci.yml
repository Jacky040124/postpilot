name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=90

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Test coverage: {rate:.1f}% (lines)")
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: postpilot:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          size=$(docker image inspect postpilot:local --format '{{.Size}}')
          echo "### Image size: $((size / 1024 / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Image runs as non-root
        run: test "$(docker run --rm postpilot:local id -u)" = "10001"

      - name: Start compose stack
        run: docker compose up -d --no-build --wait --wait-timeout 120 postgres api worker mock-webhook

      - name: End-to-end smoke test
        run: ./scripts/smoke_test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [envs/dev, envs/prod, bootstrap]
    defaults:
      run:
        working-directory: infra/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17"

      - uses: terraform-linters/setup-tflint@v6

      - name: terraform fmt
        run: terraform fmt -check -recursive ../..
        working-directory: infra/${{ matrix.dir }}

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: tflint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/infra/.tflint.hcl" --format=compact

  plan:
    name: Terraform plan
    needs: terraform
    runs-on: ubuntu-latest
    # Only runs once AWS is wired up (see README "Deploying to AWS").
    # Without the variable the job is skipped and CI stays green.
    if: vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for AWS
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ matrix.env }}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION || 'us-west-2' }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE || 'postpilot-tflock' }}"
          -backend-config="encrypt=true"

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -lock=false -out=tfplan | tee plan.txt
          {
            echo "### Plan for ${{ matrix.env }}"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  plan-skipped:
    name: Terraform plan (not configured)
    runs-on: ubuntu-latest
    if: vars.AWS_PLAN_ROLE_ARN == '' || vars.TF_STATE_BUCKET == ''
    steps:
      - run: echo "::notice::AWS_PLAN_ROLE_ARN / TF_STATE_BUCKET not set, so terraform plan was skipped."
