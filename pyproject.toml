[project]
name = "postpilot"
version = "0.1.0"
description = "Tiny social post scheduler used to demo a production-style DevOps setup"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S104"]  # binding to 0.0.0.0 is intended inside containers

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["postpilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
