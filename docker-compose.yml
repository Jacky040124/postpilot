# Local stack: API + worker + Postgres + Prometheus + Grafana + a mock webhook.
#   docker compose up -d --build
#   API: http://localhost:8000/docs   Prometheus: http://localhost:9090   Grafana: http://localhost:3000

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://postpilot:postpilot@postgres:5432/postpilot
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postpilot
      POSTGRES_PASSWORD: postpilot
      POSTGRES_DB: postpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postpilot -d postpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: postpilot:local
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true

  worker:
    image: postpilot:local
    command: ["python", "-m", "postpilot", "worker"]
    environment:
      <<: *app-env
      WEBHOOK_URL: http://mock-webhook:8080/webhook
      POLL_INTERVAL_SECONDS: "2"
      RETRY_BACKOFF_SECONDS: "5"
    ports:
      - "9100:9100"  # worker /metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy  # api creates the tables first
      mock-webhook:
        condition: service_started
    read_only: true

  mock-webhook:
    image: python:3.12-slim
    command: ["python", "/srv/server.py"]
    environment:
      FAIL_RATE: "${MOCK_WEBHOOK_FAIL_RATE:-0}"
    volumes:
      - ./mock_webhook/server.py:/srv/server.py:ro
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin  # local only
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

volumes:
  pgdata:
